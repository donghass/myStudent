version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
    networks:
      - app-net

  redis:
    image: redis:7
    container_name: my-redis
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - app-net

networks:
  app-net:
    driver: bridge